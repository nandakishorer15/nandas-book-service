name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore and dummy configs
        run: |
          touch .env
          echo '{"project_info":{"project_number":"0","project_id":"app"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.bookreaders.nandakishore"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nandas-Book-Service-APK
          path: app/build/outputs/apk/debug/*.apk
